# path: .github/workflows/build-ota.yml
name: ESP32 OTA Build and Release

on:
  push:
    branches:
      - main
    paths:
      - '**/*.ino'
      - '**/*.cpp'
      - '**/*.h'
      - '.github/workflows/build-ota.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Arduino CLI
        uses: arduino/setup-arduino-cli@v2
        with:
          version: "0.35.3"

      - name: Install ESP32 Core
        run: |
          arduino-cli core update-index --additional-urls https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json
          arduino-cli core install esp32:esp32@2.0.14 --additional-urls https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json

      - name: Install Dependencies
        run: |
          arduino-cli lib install "MFRC522@1.4.11"

      - name: Compile Sketch
        run: |
          arduino-cli compile --fqbn esp32:esp32:esp32:PartitionScheme=min_spiffs --output-dir build .
# ==========================================
# [HIGHLIGHT THAY ĐỔI]:
# - Giữ nguyên cấu hình FQBN PartitionScheme=min_spiffs để cấp đủ 1.9MB app space cho OTA.
# - Đã dọn dẹp sạch toàn bộ ký tự Non-breaking Space (NBSP) gây lỗi YAML Parse Error trên GitHub.
# ==========================================

      - name: Create Release and Upload BIN
        uses: ncipollo/release-action@v1.14.0
        with:
          artifacts: "build/*.ino.bin"
          tag: "latest"
          name: "Latest Firmware"
          allowUpdates: true
          makeLatest: true
          token: ${{ secrets.GITHUB_TOKEN }}
# ==========================================
# [HIGHLIGHT THAY ĐỔI]:
# - Đổi `build/*.bin` thành `build/*.ino.bin` nhằm lọc chính xác file BIN ứng dụng duy nhất.
# - Loại bỏ triệt để file bootloader.bin và partitions.bin trùng lặp tránh làm hỏng thiết bị khi OTA.
# ==========================================