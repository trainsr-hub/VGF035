# path: .github/workflows/build-ota.yml
name: ESP32 OTA Build and Release

on:
  push:
    branches:
      - main
    paths:
      - '**/*.ino'
      - '**/*.cpp'
      - '**/*.h'
      - '.github/workflows/build-ota.yml'
# ==========================================
# FIX: Thêm file workflow vào paths để khi push chỉnh sửa CI/CD cũng tự động kích hoạt build.
# ==========================================

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
# ==========================================
# FIX: Nâng cấp actions/checkout lên v4 mới nhất để tối ưu tốc độ và tương thích runner.
# ==========================================

      - name: Install Arduino CLI
        uses: arduino/setup-arduino-cli@v2
        with:
          version: "0.35.3"
# ==========================================
# FIX: Nâng cấp setup-arduino-cli lên v2 và cố định phiên bản CLI 0.35.3.
# ==========================================

      - name: Install ESP32 Core
        run: |
          arduino-cli core update-index --additional-urls https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json
          arduino-cli core install esp32:esp32@2.0.14 --additional-urls https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json
# ==========================================
# FIX: Cố định phiên bản ESP32 Core 2.0.14. Tránh lỗi tự nâng cấp lên Core 3.x làm gãy thư viện cũ.
# ==========================================

      - name: Install Dependencies
        run: |
          arduino-cli lib install "MFRC522@1.4.11"
# ==========================================
# FIX: Cố định phiên bản thư viện MFRC522@1.4.11 thay vì để chuỗi mơ hồ không phiên bản.
# ==========================================

      - name: Compile Sketch
        run: |
          arduino-cli compile --fqbn esp32:esp32:esp32 --output-dir build .

      - name: Create Release and Upload BIN
        uses: ncipollo/release-action@v1.14.0
        with:
          artifacts: "build/*.bin"
          tag: "latest"
          name: "Latest Firmware"
          allowUpdates: true
          makeLatest: true
          token: ${{ secrets.GITHUB_TOKEN }}
# ==========================================
# FIX: Pin chính xác phiên bản ncipollo/release-action@v1.14.0.
# ==========================================